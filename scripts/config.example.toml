# ══════════════════════════════════════════════════════════════════
# Second Brain Kit — конфіг. ЄДИНЕ місце, де живуть шляхи.
# Скопіюй у config.toml поруч (scripts/config.toml) і відредагуй.
# Всі шляхи можна писати з ~ — вони розгортаються автоматично.
# ══════════════════════════════════════════════════════════════════

[kit]
version = "3.0.0-beta.1"
config_schema = 2
data_schema = 2
profile = "guided"
# Який шар версій активний: v1 / v2 / v3. Ставить sbkit.py, руками не чіпай.
tier = "v2"

[user]
# Як підписувати людину в конвертованих чатах (заголовки ## 🧑 …)
name = "Користувач"

[vault]
# Корінь Obsidian master-vault (сюди symlink-аються всі бази)
root = "~/SecondBrain"
# Тека memory-графа (ядро: одна нота = один факт). Для Claude Code це
# ~/.claude/projects/-/memory — тоді харнес сам підвантажує MEMORY.md.
memory = "~/.claude/projects/-/memory"
# Тека сирих надиктовок людини (raw → processed)
inbox = "~/SecondBrain/inbox"
# Підтверджені дії: active/ + archive/YYYY-MM/. Це НЕ inbox і НЕ knowledge.
tasks = "~/SecondBrain/tasks"
# Зовнішні джерела: raw → source_cards → distilled → canonical
external = "~/SecondBrain/external"

[archives]
# Куди складати конвертовані MD-архіви чатів (по одному кореню на джерело).
# Кожен архів потім symlink-ається у vault.root.
chatgpt = "~/code/chatgpt-archive"
gemini = "~/code/gemini-archive"
claude = "~/code/claude-archive"
# Курований шар знань (тематичні самарі поверх сирих чатів)
knowledge = "~/code/chatgpt-archive/knowledge"
claude_code = "~/code/claude-code-archive"
codex = "~/code/codex-archive"

[live_sources]
# Сирі JSONL-джерела локальних агентів. Залиш порожнім, якщо агента нема.
claude_code_sessions = "~/.claude/projects"
codex_sessions = "~/.codex/sessions"

[maintenance]
log_path = "~/SecondBrain/log.md"
backup_dir = "~/SecondBrain/.backups"
diagnostic_dir = "~/.config/second-brain/logs"

[claude_code]
# Транскрипти сесій Claude Code (.jsonl) — індексуються як source=transcript
projects_dir = "~/.claude/projects"
# Локальні скіли (SKILL.md) — семантичний пошук «який скіл під задачу»
skills_dir = "~/.claude/skills"

[index]
# Векторний індекс sqlite-vec (створюється сам)
db_path = "~/SecondBrain/.index/index.db"

[embed]
# ДВА рівноцінні варіанти embed-рушія (модель bge-m3 однакова → вектори сумісні,
# можна перемикатись будь-коли без переіндексації). Деталі: docs/04-semantics.md.
#
# Варіант A — OpenRouter (НАЙПРОСТІШИЙ старт): нічого не встановлюєш локально.
#   Постав openrouter_enabled = true і поклади ключ у env OPENROUTER_API_KEY
#   або у файл env_file (рядок OPENROUTER_API_KEY=...). Ціна копійчана (~$0.01/M ток.).
#
# Варіант B — локальний Ollama ($0, приватно: чати не покидають машину).
#   Постав https://ollama.com і модель bge-m3 (≈1.1 ГБ). На macOS керувати
#   Ollama-моделями зручно через GUI: https://github.com/steptonite/KobzarAI
#
# Логіка auto: якщо Ollama живий — він; якщо ні і openrouter_enabled=true — OpenRouter.
ollama_url = "http://localhost:11434"
ollama_model = "bge-m3"
openrouter_enabled = false
# Чи можна ходити в OpenRouter САМОСТІЙНО, коли Ollama лежить.
# false (дефолт): ні. Кит скаже, що Ollama не піднялась, і зупиниться — краще
# так, ніж мовчки списати гроші за те, що мало бути безкоштовним. Разовий вихід
# завжди доступний прапорцем --backend openrouter.
openrouter_fallback = false
openrouter_model = "baai/bge-m3"
env_file = "~/.config/second-brain/.env"

