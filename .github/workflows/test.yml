name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q sbkit.py scripts tests
      - run: |
          # 🔴 23.08.2026: цей workflow їде і в збірку v1, а тести туди НЕ входять.
          # Раніше прогін падав на неіснуючих файлах, і публічний репо світився
          # червоним щодня, шлючи листи. Ганяємо те, що справді лежить у дереві.
          T=""
          for f in tests/test_retrieval.py tests/test_lifecycle.py tests/test_compact_snapshot.py tests/test_codex_lifecycle.py; do [ -f "$f" ] && T="$T $f"; done
          if [ -z "$T" ]; then
            echo "::notice::У цьому тирі тестів немає — нічого запускати."
            exit 0
          fi
          python -m unittest -v $T
      - run: python scripts/release_audit.py
      - run: python sbkit.py demo

  macos:
    # actions/setup-python macOS builds disable loadable SQLite extensions.
    # The supported product route uses Homebrew/python.org Python.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install python@3.13
      - run: $(brew --prefix python@3.13)/bin/python3.13 -m venv "$RUNNER_TEMP/sbkit-venv"
      - run: '"$RUNNER_TEMP/sbkit-venv/bin/python" -m pip install -r requirements.txt'
      - run: '"$RUNNER_TEMP/sbkit-venv/bin/python" -m compileall -q sbkit.py scripts tests'
      - run: |
          # 🔴 23.08.2026: цей workflow їде і в збірку v1, а тести туди НЕ входять.
          # Раніше прогін падав на неіснуючих файлах, і публічний репо світився
          # червоним щодня, шлючи листи. Ганяємо те, що справді лежить у дереві.
          T=""
          for f in tests/test_retrieval.py tests/test_lifecycle.py tests/test_compact_snapshot.py tests/test_codex_lifecycle.py; do [ -f "$f" ] && T="$T $f"; done
          if [ -z "$T" ]; then
            echo "::notice::У цьому тирі тестів немає — нічого запускати."
            exit 0
          fi
          "$RUNNER_TEMP/sbkit-venv/bin/python" -m unittest -v $T
      - run: '"$RUNNER_TEMP/sbkit-venv/bin/python" scripts/release_audit.py'
      - run: '"$RUNNER_TEMP/sbkit-venv/bin/python" sbkit.py demo'
