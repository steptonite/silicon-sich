name: maintenance

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "sqlite-vec>=0.1.9,<0.2" "numpy>=2,<3"
      - run: python -m unittest -v tests/test_v1_maintenance.py
      - run: python scripts/release_audit.py

  macos:
    # actions/setup-python macOS builds disable loadable SQLite extensions.
    # The product's documented macOS route uses Homebrew/python.org Python.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install python@3.13
      - run: $(brew --prefix python@3.13)/bin/python3.13 -m venv "$RUNNER_TEMP/sbkit-venv"
      - run: '"$RUNNER_TEMP/sbkit-venv/bin/python" -m pip install "sqlite-vec>=0.1.9,<0.2" "numpy>=2,<3"'
      - run: '"$RUNNER_TEMP/sbkit-venv/bin/python" -m unittest -v tests/test_v1_maintenance.py'
      - run: '"$RUNNER_TEMP/sbkit-venv/bin/python" scripts/release_audit.py'
