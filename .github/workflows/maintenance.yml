name: maintenance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          # Apple's system-compatible CPython 3.11 build disables loadable
          # SQLite extensions. sqlite-vec requires the python.org/Homebrew
          # build represented by current 3.13 on the macOS runner.
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "sqlite-vec>=0.1.9,<0.2" "numpy>=2,<3"
      - run: python -m unittest -v tests/test_v1_maintenance.py
      - run: python scripts/release_audit.py
