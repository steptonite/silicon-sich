name: maintenance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "sqlite-vec>=0.1.9,<0.2" "numpy>=2,<3"
      - run: python -m unittest -v tests/test_v1_maintenance.py
      - run: python scripts/release_audit.py
